<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Drone compact settings preview</title>
  <style>
    :root { color-scheme: light; --canvas:#f6f7f9; --surface:#fff; --hover:#f1f3f6; --border:#e0e4e9; --ink:#20262e; --dim:#66717e; --faint:#9099a5; --accent:#496bd7; --ok:#258b5d; font-family:Inter,"SF Pro Display","Segoe UI","Microsoft YaHei",sans-serif; }
    * { box-sizing:border-box; } body { margin:0; background:var(--canvas); color:var(--ink); }
    .page { width:1060px; margin:0 auto; padding:30px; } .eyebrow { margin:0 0 8px; color:var(--faint); font-size:11px; letter-spacing:.08em; text-transform:uppercase; }
    h1 { margin:0; font-size:21px; letter-spacing:-.02em; } .sub { margin:7px 0 22px; color:var(--dim); font-size:12px; }
    .dialog { height:650px; display:flex; flex-direction:column; overflow:hidden; border:1px solid var(--border); border-radius:14px; background:var(--surface); box-shadow:0 16px 38px rgba(30,38,52,.1); }
    .header { display:flex; align-items:center; justify-content:space-between; padding:10px 13px; border-bottom:1px solid var(--border); } .header h2 { margin:0; font-size:14px; } .close { color:var(--faint); font-size:16px; }
    .body { display:flex; min-height:0; flex:1; } .nav { width:144px; flex:none; padding:6px; border-right:1px solid var(--border); background:#fcfdfe; } .nav button { display:block; width:100%; margin-bottom:1px; border:0; border-radius:7px; padding:7px 9px; background:transparent; color:var(--dim); text-align:left; font:inherit; font-size:11px; } .nav button.active { background:var(--hover); color:var(--ink); font-weight:600; }
    .content { min-width:0; flex:1; overflow:auto; padding:10px 13px; } .content-title { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:7px; } .content-title h3 { margin:0; font-size:14px; } .content-title span { color:var(--faint); font-size:10px; }
    .rows { border-top:1px solid var(--border); } .row { display:flex; align-items:center; justify-content:space-between; gap:18px; min-height:46px; padding:7px 2px; border-bottom:1px solid var(--border); } .row-main { min-width:0; } .row-title { font-size:12px; font-weight:600; } .row-summary { overflow:hidden; margin-top:2px; color:var(--faint); font-size:10px; line-height:1.3; text-overflow:ellipsis; white-space:nowrap; }
    .segmented { display:flex; flex:none; gap:2px; padding:2px; border:1px solid var(--border); border-radius:7px; background:var(--hover); } .segmented span { padding:4px 8px; border-radius:5px; color:var(--dim); font-size:10px; } .segmented .selected { background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(20,30,40,.08); font-weight:600; }
    .switch { position:relative; width:30px; height:17px; flex:none; border-radius:99px; background:#3b9d6e; } .switch:after { content:""; position:absolute; top:3px; right:3px; width:11px; height:11px; border-radius:50%; background:white; box-shadow:0 1px 2px rgba(0,0,0,.2); }
    .badge { flex:none; border:1px solid #b9dfca; border-radius:99px; padding:3px 7px; color:var(--ok); font-size:10px; white-space:nowrap; } .meta { flex:none; color:var(--faint); font-size:10px; white-space:nowrap; }
    details { border-bottom:1px solid var(--border); } summary { display:flex; align-items:center; justify-content:space-between; gap:18px; min-height:46px; padding:7px 2px; cursor:pointer; list-style:none; } summary::-webkit-details-marker { display:none; } .chevron { color:var(--faint); font-size:11px; } details[open] .chevron { transform:rotate(180deg); }
    .details { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; padding:0 2px 10px; } .detail { border-radius:7px; background:var(--hover); padding:7px 8px; } .detail b { display:block; margin-bottom:3px; color:var(--faint); font-size:9px; font-weight:500; } .detail span { color:var(--dim); font-size:10px; }
    .note { margin-top:10px; color:var(--faint); font-size:10px; line-height:1.45; } .compare { display:flex; gap:8px; margin-top:18px; color:var(--faint); font-size:10px; } .compare i { width:6px; height:6px; margin-top:3px; border-radius:50%; background:var(--accent); }
  </style>
</head>
<body>
  <main class="page">
    <p class="eyebrow">Drone · settings density v2</p>
    <h1>设置面板收缩方案</h1>
    <p class="sub">外壳、导航、内容区各缩一级；功能保留，长提示按需展开。</p>
    <section class="dialog" aria-label="紧凑设置面板">
      <header class="header"><h2>设置</h2><span class="close">×</span></header>
      <div class="body">
        <nav class="nav" aria-label="设置分类"><button type="button" class="active">通用</button><button type="button">外观</button><button type="button">模型</button><button type="button">技能</button><button type="button">MCP</button><button type="button">知识库</button><button type="button">Zotero</button><button type="button">扩展</button><button type="button">局域网</button><button type="button">关于</button></nav>
        <div class="content">
          <div class="content-title"><h3>通用</h3><span>3 个基础设置 · 1 个访问守卫</span></div>
          <div class="rows">
            <div class="row"><div class="row-main"><div class="row-title">语言</div><div class="row-summary">界面语言</div></div><div class="segmented"><span>中文</span><span class="selected">English</span></div></div>
            <div class="row"><div class="row-main"><div class="row-title">上下文管理</div><div class="row-summary">自动收缩较早上下文，保持当前任务连贯</div></div><div class="segmented"><span class="selected">自动</span><span>关闭</span></div></div>
            <div class="row"><div class="row-main"><div class="row-title">频道监听</div><div class="row-summary">跨会话更新会唤醒当前会话</div></div><span class="switch" role="img" aria-label="已启用"></span></div>
            <details open><summary><div class="row-main"><div class="row-title">SSH 守卫</div><div class="row-summary">本机密钥 · 默认每次确认 · 单次授权</div></div><div><span class="badge">已启用</span><span class="chevron">⌃</span></div></summary><div class="details"><div class="detail"><b>访问策略</b><span>默认每次确认</span></div><div class="detail"><b>密钥来源</b><span>本机 OpenSSH</span></div><div class="detail"><b>授权范围</b><span>单次，可显式记住</span></div></div></details>
          </div>
          <p class="note">审批请求与执行结果会保留在会话记录中。完整说明只在展开 SSH 守卫时出现。</p>
          <div class="compare"><i></i><span>单表面、短行、统一分隔线；首屏可见全部通用项。</span></div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
