appId: io.github.gyoungwe.drone
productName: Drone
beforePack: "../../scripts/verify-research-release.cjs"
directories:
  output: dist
files:
  - out/**
  - package.json
  - "!node_modules/@drone"
asarUnpack:
  - "**/*.node"
  # UI 插件运行时构建：esbuild 要 spawn 平台二进制，asar 内无法 exec（spawn ENOTDIR）；
  # unpack 后 Electron child_process 自动把 app.asar 路径重写为 app.asar.unpacked
  - "**/node_modules/esbuild/**"
  - "**/node_modules/@esbuild/**"
# pi SDK 包资源镜像：docs/examples/README 不进 asar，agent 的 read/bash 工具都能直接访问。
# main 进程经 PI_PACKAGE_DIR 指到这里（export-html/themes/package.json 同根解析，必须一起带）。
extraResources:
  # Bundled compute runner used by the local executor and deployed to SSH hosts after checksum verification.
  - from: "../backend/resources/compute-runner"
    to: "compute-runner"
    filter: ["**/*", "!__pycache__/**"]
  - from: "../../node_modules/@earendil-works/pi-coding-agent/docs"
    to: "pi-package/docs"
  - from: "../../node_modules/@earendil-works/pi-coding-agent/examples"
    to: "pi-package/examples"
  - from: "../../node_modules/@earendil-works/pi-coding-agent/README.md"
    to: "pi-package/README.md"
  - from: "../../node_modules/@earendil-works/pi-coding-agent/CHANGELOG.md"
    to: "pi-package/CHANGELOG.md"
  - from: "../../node_modules/@earendil-works/pi-coding-agent/package.json"
    to: "pi-package/package.json"
  - from: "../../node_modules/@earendil-works/pi-coding-agent/dist/core/export-html"
    to: "pi-package/dist/core/export-html"
  - from: "../../node_modules/@earendil-works/pi-coding-agent/dist/modes/interactive/theme"
    to: "pi-package/dist/modes/interactive/theme"
  - from: "../../node_modules/@earendil-works/pi-coding-agent/dist/modes/interactive/assets"
    to: "pi-package/dist/modes/interactive/assets"
  # UI 插件 agent 规范三件套（SPEC/drone-ui.d.ts/skill/examples）：main 经 process.resourcesPath 读取
  - from: "resources/ui-plugins"
    to: "ui-plugins"
  # 内置协作 skill（channel-pickup/design-handoff）：additionalSkillPaths 扫描，与 UI 插件目录分列
  - from: "resources/skills"
    to: "skills"
  # Reviewed built-in research sources. Each pack is pinned and receipt-verified before packaging.
  - from: "resources/research-skills/nature"
    to: "research-skills/nature"
    filter: ["**/*", ".drone-pack.json"]
  - from: "resources/research-skills/scientific"
    to: "research-skills/scientific"
    filter: ["**/*", ".drone-pack.json"]
  # Bundled pi packages (exact pins in pi-packages/package.json + package-lock.json), staged by
  # scripts/stage-pi-packages.mjs; beforePack fails closed when they are missing or stale.
  # pi-mcp-adapter is the MCP runtime: main loads <resources>/pi-packages/node_modules/pi-mcp-adapter/index.ts.
  # Kept outside research-workbench/ because that tree is audited to contain no node_modules.
  - from: "pi-packages/node_modules"
    to: "pi-packages/node_modules"
    filter: ["**/*", "!.drone-staged.json", "!.package-lock.json"]
  # All first-party research capabilities, loaded from one versioned manifest.
  # Never package local settings, sessions, downloaded papers, credentials or the user skill directory.
  - from: "../../.pi/extensions"
    to: "research-workbench/extensions"
    filter: ["*.mjs", "workbench-manifest.json"]
  # The knowledge worker is fetched from the pinned external plugin package.
  # The plugin's native entry is loaded through the managed Pi package root;
  # copying an unused duplicate into the workbench made the host look as if it
  # owned the plugin and was never consumed by a runtime loader.
  - from: "../../vendor/plugins/pi-knowledge/lib/knowledge/runtime/worker.mjs"
    to: "research-workbench/extensions/knowledge-worker.mjs"
  - from: "../../vendor/plugins/pi-knowledge/lib/knowledge/runtime/.knowledge-worker-manifest.json"
    to: "research-workbench/extensions/.knowledge-worker-manifest.json"
  - from: "../../.pi/skills/research-vault"
    to: "research-workbench/skills/research-vault"
  - from: "../../.pi/skills/research-workflow"
    to: "research-workbench/skills/research-workflow"
  - from: "../../.pi/skills/research-show-me"
    to: "research-workbench/skills/research-show-me"
  - from: "../../.pi/skills/zotero-literature"
    to: "research-workbench/skills/zotero-literature"
  - from: "../../.pi/skills/bio-environment"
    to: "research-workbench/skills/bio-environment"
mac:
  extraResources:
    - from: "plugin-runtime/darwin-${arch}"
      to: "plugin-runtime"
  category: public.app-category.developer-tools
  # Releases intentionally remain unsigned. Signing and notarization are optional
  # enhancements and are not required by the release workflow.
  hardenedRuntime: false
  notarize: false
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # 产物名与 productName 解耦：保持 drone-mac-* 兼容 README 下载表（productName 带空格仅作显示名）
  artifactName: drone-mac-${arch}.${ext}
win:
  extraResources:
    - from: "plugin-runtime/win32-${arch}"
      to: "plugin-runtime"
  # Unsigned Windows artifacts are intentional; SmartScreen may prompt on install.
  signAndEditExecutable: false
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  artifactName: drone-windows-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  extraResources:
    - from: "plugin-runtime/linux-${arch}"
      to: "plugin-runtime"
  category: Development
  # workspace 包名是 @drone/desktop；AppImage/deb 需要安全的可执行文件名
  executableName: drone
  maintainer: Yangwei Gao <974283650@qq.com>
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  # 固定 x64 文件名：electron-builder 对 AppImage 会把 arch 扩成 x86_64
  artifactName: drone-linux-x64.${ext}
publish:
  provider: github
  owner: Gyoungwe
  repo: Drone
