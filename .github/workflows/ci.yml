name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugins:
    name: Locked plugin sources (rebuild and verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      # Rebuild every locked plugin from its exact source commit and verify the tarball
      # hash once; the other jobs re-verify and unpack these same bytes on every platform.
      - run: npm run fetch:plugins
      - uses: actions/upload-artifact@v4
        with:
          name: locked-plugin-tarballs
          path: vendor/plugins/.tarballs/
          if-no-files-found: error

  static:
    name: Static checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    needs: plugins
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: locked-plugin-tarballs
          path: vendor/plugins/.tarballs/
      - name: Checkout bound plugin workspace
        uses: actions/checkout@v6
        with:
          repository: Gyoungwe/drone-plugins
          ref: main
          path: drone-plugins
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:arch
      - run: npm run test:arch
      - run: npm run check:plugin-api
        env:
          DRONE_PLUGINS_DIR: ${{ github.workspace }}/drone-plugins
      - run: npm run check:extensions
      - run: npm run test:research-packaging

  unit:
    name: Backend unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    needs: plugins
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: locked-plugin-tarballs
          path: vendor/plugins/.tarballs/
      # Same as the root pretest: build the workspace Plugin API, unpack the plugin artifacts
      # pinned in plugins.lock.json (node_modules/@gyoungwe/* and the gitignored
      # .pi/extensions/knowledge-worker.mjs) and stage the bundled plugin runtime.
      - run: npm run prepare:test
      - run: npm run test:unit

  sdk:
    name: Backend SDK tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    needs: plugins
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: locked-plugin-tarballs
          path: vendor/plugins/.tarballs/
      # Same as the root pretest: build the workspace Plugin API, unpack the plugin artifacts
      # pinned in plugins.lock.json (node_modules/@gyoungwe/* and the gitignored
      # .pi/extensions/knowledge-worker.mjs) and stage the bundled plugin runtime.
      - run: npm run prepare:test
      # Bundled MCP runtime (pinned pi-mcp-adapter); the SDK suite loads it like the packaged app.
      - run: npm run stage:pi-packages
      - run: npm run test:sdk

  desktop:
    name: Desktop and workspace tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    needs: plugins
    runs-on: ${{ matrix.os }}
    env:
      # electron-vite OOMs at the default heap on macos-latest (same as release.yml build).
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: locked-plugin-tarballs
          path: vendor/plugins/.tarballs/
      # Same as the root pretest: build the workspace Plugin API, unpack the plugin artifacts
      # pinned in plugins.lock.json (node_modules/@gyoungwe/* and the gitignored
      # .pi/extensions/knowledge-worker.mjs) and stage the bundled plugin runtime.
      - run: npm run prepare:test
      - name: Checkout bound plugin workspace
        uses: actions/checkout@v6
        with:
          repository: Gyoungwe/drone-plugins
          ref: main
          path: drone-plugins
      # Backend is covered by the parallel unit/sdk jobs. Keep the other
      # workspace suites and the root upgrade/build gates in this job. Knowledge
      # and tasks moved to drone-plugins and are tested by its CI.
      - name: Preload real-load (required)
        run: npm run test:preload
      - run: npm test -w @drone/shared
      - run: npm test -w @drone/desktop
        env:
          DRONE_PLUGINS_DIR: ${{ github.workspace }}/drone-plugins
      - run: npm test -w @drone/extensions
      - run: npm test -w @drone/research
      - run: npm test -w @drone/compute
      - run: npm test -w @drone/inquiry
      - run: npm run check:knowledge-runtime
      - run: npm run check:tasks-runtime
      - run: npm run check:research-runtime
      - run: npm run test:upgrade
      # The installer ships pi-packages/node_modules; verify the mapping, pins and that the adapter loads.
      - run: npm run stage:pi-packages
      - run: npm run check:pi-packages
      - run: npm run build

  pi-package-format:
    name: Official Pi package format (locked knowledge)
    needs: plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: locked-plugin-tarballs
          path: vendor/plugins/.tarballs/
      - run: npm run fetch:plugins
      # Pi's own package manager resolves the locked package as a source and loads it
      # without Drone; native Pi closed loops are out of scope (2026-10-29 revision).
      - run: npm run check:pi-package-format
