name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Classifies the PR diff. Dev-environment-only PRs (Claude Code hooks, agent skills,
  # git hooks, docs, root-level Markdown) skip the heavy suites; static checks still run
  # because lint and test:arch cover the scripts. Markdown under packages/ or .pi/ ships
  # as runtime skills, so only root-level *.md counts as dev-only. push and
  # workflow_dispatch always run everything.
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v6
        if: github.event_name == 'pull_request'
        with:
          # The PR merge commit and its first parent (the current base tip) suffice.
          fetch-depth: 2
      - id: classify
        shell: bash
        run: |
          code=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            code=false
            while IFS= read -r f; do
              case "$f" in
                .claude/*|.agents/*|.githooks/*|docs/*) ;;
                */*) code=true ;;
                *.md) ;;
                *) code=true ;;
              esac
            done < <(git diff --name-only HEAD^1 HEAD)
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  plugins:
    name: Locked plugin sources (rebuild and verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      # Rebuild every locked plugin from its exact source commit and verify the tarball
      # hash once; the other jobs re-verify and unpack these same bytes on every platform.
      - run: npm run fetch:plugins
      - uses: actions/upload-artifact@v4
        with:
          name: locked-plugin-tarballs
          path: vendor/plugins/.tarballs/
          # upload-artifact v4 skips dot-directories unless asked.
          include-hidden-files: true
          if-no-files-found: error

  static:
    name: Static checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Dev-env-only PRs skip the Windows leg; the required check is the macOS one.
        os: ${{ fromJSON(needs.changes.outputs.code == 'true' && '["windows-latest","macos-latest"]' || '["macos-latest"]') }}
    needs: [changes, plugins]
    # Releases ship macOS only. Windows runs for visibility until its known failures
    # (plugin build spawns, path aliases, file modes) are fixed; see docs/PITFALLS.md.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: locked-plugin-tarballs
          path: vendor/plugins/.tarballs/
      - name: Checkout bound plugin workspace
        uses: actions/checkout@v6
        with:
          repository: Gyoungwe/drone-plugins
          ref: main
          path: drone-plugins
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:arch
      - run: npm run test:arch
      - name: Report unused files and exports
        run: npm run knip
      - run: npm run check:plugin-api
        env:
          DRONE_PLUGINS_DIR: ${{ github.workspace }}/drone-plugins
      - run: npm run check:extensions
      - run: npm run test:research-packaging

  unit:
    name: Backend unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    needs: [changes, plugins]
    if: needs.changes.outputs.code == 'true'
    # Releases ship macOS only. Windows runs for visibility until its known failures
    # (plugin build spawns, path aliases, file modes) are fixed; see docs/PITFALLS.md.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: locked-plugin-tarballs
          path: vendor/plugins/.tarballs/
      # Same as the root pretest: build the workspace Plugin API, unpack the plugin artifacts
      # pinned in plugins.lock.json (node_modules/@gyoungwe/* and the gitignored
      # .pi/extensions/knowledge-worker.mjs) and stage the bundled plugin runtime.
      - run: npm run prepare:test
      - run: npm run test:unit

  sdk:
    name: Backend SDK tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    needs: [changes, plugins]
    if: needs.changes.outputs.code == 'true'
    # Releases ship macOS only. Windows runs for visibility until its known failures
    # (plugin build spawns, path aliases, file modes) are fixed; see docs/PITFALLS.md.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: locked-plugin-tarballs
          path: vendor/plugins/.tarballs/
      # Same as the root pretest: build the workspace Plugin API, unpack the plugin artifacts
      # pinned in plugins.lock.json (node_modules/@gyoungwe/* and the gitignored
      # .pi/extensions/knowledge-worker.mjs) and stage the bundled plugin runtime.
      - run: npm run prepare:test
      # Bundled MCP runtime (pinned pi-mcp-adapter); the SDK suite loads it like the packaged app.
      - run: npm run stage:pi-packages
      - run: npm run test:sdk

  desktop:
    name: Desktop and workspace tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    needs: [changes, plugins]
    if: needs.changes.outputs.code == 'true'
    # Releases ship macOS only. Windows runs for visibility until its known failures
    # (plugin build spawns, path aliases, file modes) are fixed; see docs/PITFALLS.md.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    runs-on: ${{ matrix.os }}
    env:
      # electron-vite OOMs at the default heap on macos-latest (same as release.yml build).
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: locked-plugin-tarballs
          path: vendor/plugins/.tarballs/
      # Same as the root pretest: build the workspace Plugin API, unpack the plugin artifacts
      # pinned in plugins.lock.json (node_modules/@gyoungwe/* and the gitignored
      # .pi/extensions/knowledge-worker.mjs) and stage the bundled plugin runtime.
      - run: npm run prepare:test
      - name: Checkout bound plugin workspace
        uses: actions/checkout@v6
        with:
          repository: Gyoungwe/drone-plugins
          ref: main
          path: drone-plugins
      # Backend is covered by the parallel unit/sdk jobs. Keep the other
      # workspace suites and the root upgrade/build gates in this job. Knowledge
      # and tasks moved to drone-plugins and are tested by its CI.
      - name: Preload real-load (required)
        run: npm run test:preload
      - run: npm test -w @drone/shared
      - run: npm test -w @drone/desktop
        env:
          DRONE_PLUGINS_DIR: ${{ github.workspace }}/drone-plugins
      - run: npm test -w @drone/extensions
      - run: npm test -w @drone/compute
      - run: npm test -w @drone/inquiry
      - run: npm run check:knowledge-runtime
      - run: npm run check:tasks-runtime
      - run: npm run test:upgrade
      # The installer ships pi-packages/node_modules; verify the mapping, pins and that the adapter loads.
      - run: npm run stage:pi-packages
      - run: npm run check:pi-packages
      - run: npm run check:builtin-plugins
      - run: npm run build

  pi-package-format:
    name: Official Pi package format (locked knowledge)
    needs: [changes, plugins]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: locked-plugin-tarballs
          path: vendor/plugins/.tarballs/
      - run: npm run fetch:plugins
      # Pi's own package manager resolves the locked package as a source and loads it
      # without Drone; native Pi closed loops are out of scope (2026-10-29 revision).
      - run: npm run check:pi-package-format

  # The single required check for branch protection. Skipped jobs (dev-env-only PRs) pass;
  # a failed or cancelled required job fails the gate. Matrix legs with continue-on-error
  # (Windows) do not fail their job's aggregate result.
  gate:
    name: CI gate
    if: always()
    needs: [changes, plugins, static, unit, sdk, desktop, pi-package-format]
    runs-on: ubuntu-latest
    steps:
      - name: Check required job results
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needs results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a required job ended with: $r"; exit 1 ;;
            esac
          done
