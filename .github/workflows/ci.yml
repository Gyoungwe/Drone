name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:arch
      - run: npm run test:arch
      - run: npm run check:plugin-api
      - run: npm run check:extensions
      - run: npm run test:research-packaging

  unit:
    name: Backend unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  sdk:
    name: Backend SDK tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Bundled MCP runtime (pinned pi-mcp-adapter); the SDK suite loads it like the packaged app.
      - run: npm run stage:pi-packages
      - run: npm run test:sdk

  desktop:
    name: Desktop and workspace tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # electron-vite OOMs at the default heap on macos-latest (same as release.yml build).
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Backend is covered by the parallel unit/sdk jobs. Keep the other
      # workspace suites and the root upgrade/build gates in this job.
      - name: Preload real-load (required)
        run: npm run test:preload
      - run: npm test -w @drone/shared
      - run: npm test -w @drone/desktop
      - run: npm test -w @drone/extensions
      - run: npm test -w @drone/knowledge
      - run: npm test -w @drone/tasks
      - run: npm test -w @drone/research
      - run: npm test -w @drone/compute
      - run: npm test -w @drone/inquiry
      - run: npm run check:knowledge-runtime
      - run: npm run check:tasks-runtime
      - run: npm run check:research-runtime
      - run: npm run test:upgrade
      # The installer ships pi-packages/node_modules; verify the mapping, pins and that the adapter loads.
      - run: npm run stage:pi-packages
      - run: npm run check:pi-packages
      - run: npm run build

  pi-package-smoke:
    name: Native Pi knowledge package (fixture smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build pi-knowledge package
        run: npm run build:pi-knowledge
      - name: Check pi-knowledge package artifacts
        run: npm run check:pi-knowledge
      - name: Typecheck pi-knowledge package
        run: npm run typecheck -w @gyoungwe/pi-knowledge
      - name: "Fixture smoke (external Pi CLI: NOT_RUN)"
        run: npm run smoke:pi-knowledge -- --fixture-only
