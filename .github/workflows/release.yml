name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: v* tag to publish. Leave empty to derive v<version> from packages/desktop/package.json on this ref and create the tag if missing.
        required: false
        default: ""
        type: string
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - packages/desktop/package.json

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Resolve the release tag once. Sources, in order: explicit dispatch input, pushed v* tag,
  # or v<version> from packages/desktop/package.json (main push / empty dispatch input).
  # For the derived case the tag is created on the current commit only when it does not exist yet,
  # so an ordinary main push without a version bump is a no-op.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      release: ${{ steps.pick.outputs.release }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: pick
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ] && [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
            git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || { echo "Tag $TAG does not exist" >&2; exit 1; }
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"; echo "release=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$EVENT" = "push" ] && [ "$REF_TYPE" = "tag" ]; then
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"; echo "release=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          TAG="v$(node -p "require('./packages/desktop/package.json').version")"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            if [ "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$(git rev-parse HEAD)" ]; then
              echo "Tag $TAG already points at HEAD; re-running release for it."
              echo "tag=$TAG" >> "$GITHUB_OUTPUT"; echo "release=true" >> "$GITHUB_OUTPUT"
            else
              echo "Tag $TAG already exists on another commit; nothing to release."
              echo "tag=$TAG" >> "$GITHUB_OUTPUT"; echo "release=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          [ -f "docs/releases/$TAG.md" ] || echo "::warning::docs/releases/$TAG.md not found; release notes will be auto-generated."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "refs/tags/$TAG"
          echo "Created and pushed $TAG at $(git rev-parse --short HEAD)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"; echo "release=true" >> "$GITHUB_OUTPUT"

  validate:
    needs: resolve
    if: needs.resolve.outputs.release == 'true'
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run stage:pi-packages
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:upgrade

  prepare:
    needs: [resolve, validate]
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Validate release tag
        run: |
          [[ "$RELEASE_TAG" == v* ]] || { echo "Release tag must start with v" >&2; exit 1; }
          test "v$(node -p "require('./packages/desktop/package.json').version")" = "$RELEASE_TAG"
      - name: Prepare draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$RELEASE_TAG"
          NOTES="docs/releases/${TAG}.md"
          if gh release view "$TAG" -R "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists; reusing it for this workflow run."
          elif [ -f "$NOTES" ]; then
            gh release create "$TAG" -R "${{ github.repository }}" --draft --title "$TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" -R "${{ github.repository }}" --draft --title "$TAG" --generate-notes
          fi

  build:
    needs: [resolve, prepare]
    strategy:
      fail-fast: false
      # Platforms build in parallel. Builds no longer talk to the release: each job only
      # stores its outputs as a workflow artifact, and the single publish job uploads
      # everything afterwards, so the release never receives concurrent large streams
      # (the reason max-parallel: 1 was introduced in 4164df0 / #25).
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      # 无开发者证书：mac 显式走 adhoc 签名（identity: "-"），禁用 runner 上的证书自动发现
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # check-research-packaging.cjs (below) verifies the staged MCP runtime
      # (packages/desktop/pi-packages/node_modules/pi-mcp-adapter), so stage it before that check.
      - run: npm run stage:pi-packages
      # packages/desktop/resources/research-skills/ is gitignored and rebuilt from the
      # commit/checksum-pinned lock (packages/shared/src/research-skill-sources.json);
      # `npm run dist` and the electron-builder beforePack hook fail closed without it.
      # ARS is CC BY-NC 4.0: Drone is distributed free of charge for noncommercial use, so the release
      # ships it under the license's own NonCommercial grant with LICENSE/NOTICE intact; recipients are
      # bound by the same terms. See docs/research-skill-packs.md ("Sources and licenses").
      - name: Acquire pinned research skill packs
        shell: bash
        run: |
          python scripts/sync-research-skills.py --sources nature scientific
          python scripts/sync-research-skills.py --sources academic --acknowledge-noncommercial
          python scripts/sync-research-skills.py --sources nature scientific academic --check --for-release
          node scripts/check-research-packaging.cjs
      - run: npm run dist -w packages/desktop -- --publish never
      # The MCP runtime must be inside every packaged app (resources/pi-packages/node_modules/pi-mcp-adapter).
      - name: Verify bundled MCP runtime in packaged app
        run: node scripts/check-pi-packages.mjs --packaged packages/desktop/dist
      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find packages/desktop/dist -maxdepth 1 -type f ! -name 'builder-debug.yml' ! -name 'builder-effective-config.yaml' \
            -exec cp {} release-assets/ \;
          if [ -z "$(ls -A release-assets)" ]; then echo "No release assets were produced." >&2; exit 1; fi
          ls -l release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: [resolve, build]
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify required assets
        run: |
          set -euo pipefail
          ls -l release-assets
          # Updater metadata comes one file per platform (latest.yml / latest-mac.yml / latest-linux.yml),
          # so no merging is needed; a name collision would mean two platforms wrote the same file.
          for REQUIRED in \
            drone-mac-arm64.dmg drone-mac-x64.dmg drone-mac-arm64.zip drone-mac-x64.zip \
            drone-windows-x64.exe drone-windows-x64.zip \
            drone-linux-x64.AppImage drone-linux-x64.deb \
            latest.yml latest-mac.yml latest-linux.yml; do
            [ -f "release-assets/$REQUIRED" ] || { echo "Missing required release asset: $REQUIRED" >&2; exit 1; }
          done
      - name: Upload assets to draft release (sequential, with retry)
        timeout-minutes: 90
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Avoid stalled HTTP/2 streams in the Go-based gh client.
          GODEBUG: http2client=0
        run: |
          set -uo pipefail
          for ASSET in release-assets/*; do
            echo "Uploading $ASSET"
            ATTEMPT=1
            until gh release upload "$RELEASE_TAG" "$ASSET" -R "${{ github.repository }}" --clobber; do
              if [ "$ATTEMPT" -ge 5 ]; then
                echo "Failed to upload $ASSET after $ATTEMPT attempts." >&2
                exit 1
              fi
              SLEEP_SECONDS=$((ATTEMPT * 20))
              echo "Upload failed for $ASSET (attempt $ATTEMPT). Retrying in ${SLEEP_SECONDS}s..." >&2
              sleep "$SLEEP_SECONDS"
              ATTEMPT=$((ATTEMPT + 1))
            done
          done
      - name: Verify uploaded assets and publish draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          ASSETS="$(gh release view "$TAG" -R "${{ github.repository }}" --json assets --jq '.assets[].name')"
          for LOCAL in release-assets/*; do
            NAME="$(basename "$LOCAL")"
            grep -Fxq "$NAME" <<<"$ASSETS" || { echo "Asset not on release: $NAME" >&2; exit 1; }
          done
          gh release edit "$TAG" -R "${{ github.repository }}" --draft=false

  # 刷新官网（drone-website，Cloudflare Pages）：触发 Deploy Hook 重建，同步版本号与 changelog。
  # 需要 repo secret CF_PAGES_DEPLOY_HOOK（Cloudflare Pages → Settings → Builds → Deploy hooks 创建）；未配置时跳过不影响发布
  website:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages deploy hook
        env:
          HOOK: ${{ secrets.CF_PAGES_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then
            curl -fsS -X POST "$HOOK"
          else
            echo "CF_PAGES_DEPLOY_HOOK not set, skipping"
          fi
