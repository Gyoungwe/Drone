name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to publish
        required: true
        type: string
  push:
    tags: ["v*"]

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Validate release tag
        run: |
          [[ "$RELEASE_TAG" == v* ]] || { echo "Release tag must start with v" >&2; exit 1; }
          test "v$(node -p "require('./packages/desktop/package.json').version")" = "$RELEASE_TAG"
      - name: Prepare draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$RELEASE_TAG"
          NOTES="docs/releases/${TAG}.md"
          if gh release view "$TAG" -R "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists; reusing it for this workflow run."
          elif [ -f "$NOTES" ]; then
            gh release create "$TAG" -R "${{ github.repository }}" --draft --title "$TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" -R "${{ github.repository }}" --draft --title "$TAG" --generate-notes
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # 无开发者证书：mac 显式走 adhoc 签名（identity: "-"），禁用 runner 上的证书自动发现
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist -w packages/desktop -- --publish never
      - name: Upload build outputs directly to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSET_LIST="$(mktemp)"
          find packages/desktop/dist -maxdepth 1 -type f \
            ! -name 'builder-debug.yml' \
            -print | sort > "$ASSET_LIST"
          if [ ! -s "$ASSET_LIST" ]; then
            echo "No release assets were produced." >&2
            exit 1
          fi
          while IFS= read -r ASSET; do
            echo "Uploading $ASSET"
            gh release upload "$RELEASE_TAG" "$ASSET" \
              -R "${{ github.repository }}" --clobber
          done < "$ASSET_LIST"
          rm -f "$ASSET_LIST"

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Verify required assets and publish draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$RELEASE_TAG"
          ASSETS="$(gh release view "$TAG" -R "${{ github.repository }}" --json assets --jq '.assets[].name')"
          for REQUIRED in \
            percho-mac-arm64.dmg \
            percho-mac-x64.dmg \
            percho-windows-x64.exe \
            percho-windows-x64.zip; do
            if ! grep -Fxq "$REQUIRED" <<<"$ASSETS"; then
              echo "Missing required release asset: $REQUIRED" >&2
              exit 1
            fi
          done
          gh release edit "$TAG" -R "${{ github.repository }}" --draft=false

  # 刷新官网（percho-website，Cloudflare Pages）：触发 Deploy Hook 重建，同步版本号与 changelog。
  # 需要 repo secret CF_PAGES_DEPLOY_HOOK（Cloudflare Pages → Settings → Builds → Deploy hooks 创建）；未配置时跳过不影响发布
  website:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages deploy hook
        env:
          HOOK: ${{ secrets.CF_PAGES_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then
            curl -fsS -X POST "$HOOK"
          else
            echo "CF_PAGES_DEPLOY_HOOK not set, skipping"
          fi
