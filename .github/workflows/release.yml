name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: v* tag to publish. Leave empty to derive v<version> from packages/desktop/package.json on this ref and create the tag if missing.
        required: false
        default: ""
        type: string
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - packages/desktop/package.json
      - packages/desktop/electron-builder.yml
      - scripts/verify-research-release.cjs
      - scripts/sync-research-skills.py
      - scripts/check-research-packaging.cjs
      - .github/workflows/release.yml

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      ref: ${{ steps.pick.outputs.ref }}
      release: ${{ steps.pick.outputs.release }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: pick
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ] && [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
            git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || { echo "Tag $TAG does not exist" >&2; exit 1; }
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"; echo "ref=$TAG" >> "$GITHUB_OUTPUT"; echo "release=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$EVENT" = "push" ] && [ "$REF_TYPE" = "tag" ]; then
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"; echo "ref=$REF_NAME" >> "$GITHUB_OUTPUT"; echo "release=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          TAG="v$(node -p "require('./packages/desktop/package.json').version")"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            if [ "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$(git rev-parse HEAD)" ]; then
              echo "Tag $TAG already points at HEAD; re-running release for it."
              echo "tag=$TAG" >> "$GITHUB_OUTPUT"; echo "ref=$TAG" >> "$GITHUB_OUTPUT"; echo "release=true" >> "$GITHUB_OUTPUT"
            else
              echo "Tag $TAG already exists on another commit; nothing to release."
              echo "tag=$TAG" >> "$GITHUB_OUTPUT"; echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"; echo "release=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          [ -f "docs/releases/$TAG.md" ] || echo "::warning::docs/releases/$TAG.md not found; release notes will be auto-generated."
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"; echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"; echo "release=true" >> "$GITHUB_OUTPUT"

  validate:
    needs: resolve
    if: needs.resolve.outputs.release == 'true'
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      NODE_OPTIONS: --max-old-space-size=8192
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run stage:pi-packages
      # 发版前必跑：用假 electron 真实加载 preload（v0.29.0 白屏回归），失败即阻断发布
      - name: Preload real-load (required)
        run: npm run test:preload
      - run: npm run lint
      - run: npm run typecheck
      # Keep release validation aligned with the main CI static gate. These
      # checks intentionally run against the checked-out candidate ref so a
      # green build cannot publish stale generated/runtime resources.
      - run: npm run check:arch
      - run: npm run test:arch
      - name: Checkout bound plugin workspace
        uses: actions/checkout@v6
        with:
          repository: Gyoungwe/drone-plugins
          ref: main
          path: drone-plugins
      - run: npm run check:plugin-api
        env:
          DRONE_PLUGINS_DIR: ${{ github.workspace }}/drone-plugins
      - run: npm run check:extensions
      - run: npm run check:knowledge-runtime
      - run: npm run check:tasks-runtime
      - run: npm run check:research-runtime
      - run: npm run test:research-packaging
      - run: npm test
      - run: npm run test:upgrade
      # The desktop job in main CI also verifies the staged MCP tree and a
      # production renderer/main build. stage:pi-packages above is idempotent;
      # check:pi-packages is read-only and catches a broken release boundary.
      - run: npm run check:pi-packages
      - run: npm run build

  prepare:
    needs: [resolve, validate]
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.ref }}
      - name: Create or verify release tag after validation
        env:
          RELEASE_REF: ${{ needs.resolve.outputs.ref }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          CANDIDATE="$(git rev-parse "$RELEASE_REF^{commit}")"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$CANDIDATE"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$CANDIDATE" -m "$TAG"
            git push origin "refs/tags/$TAG"
          fi
      - name: Validate release tag
        run: |
          [[ "$RELEASE_TAG" == v* ]] || { echo "Release tag must start with v" >&2; exit 1; }
          test "v$(node -p "require('./packages/desktop/package.json').version")" = "$RELEASE_TAG"
      - name: Prepare draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$RELEASE_TAG"
          NOTES="docs/releases/${TAG}.md"
          if gh release view "$TAG" -R "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG already exists; reusing it for this workflow run."
          elif [ -f "$NOTES" ]; then
            gh release create "$TAG" -R "${{ github.repository }}" --draft --title "$TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" -R "${{ github.repository }}" --draft --title "$TAG" --generate-notes
          fi

  build:
    needs: [resolve, prepare]
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - os: macos-latest
            platform: mac-arm64
            artifact_zip: drone-mac-arm64.zip
            builder_args: --arm64
          - os: macos-latest
            platform: mac-x64
            artifact_zip: drone-mac-x64.zip
            builder_args: --x64
          - os: windows-latest
            platform: windows
            artifact_zip: ''
            builder_args: --x64
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # electron-vite OOMs at the default heap on macos-latest while bundling the Pi 1.1.0 runtime.
      NODE_OPTIONS: --max-old-space-size=8192
      DRONE_RELEASE_UNSIGNED: "true"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run stage:pi-packages
      - name: Acquire pinned research skill packs
        shell: bash
        run: |
          python scripts/sync-research-skills.py --sources nature scientific
          python scripts/sync-research-skills.py --sources nature scientific --check
          node scripts/check-research-packaging.cjs
      - name: Build unsigned release artifacts
        run: npm run dist -w packages/desktop -- --publish never ${{ matrix.builder_args }}
      - name: Verify unsigned release mode
        shell: bash
        run: |
          set -euo pipefail
          test "$DRONE_RELEASE_UNSIGNED" = "true"
          test -d packages/desktop/dist
          echo "Unsigned release artifacts are intentional; OS trust prompts remain expected."
      - name: Verify bundled MCP runtime in packaged app
        run: node scripts/check-pi-packages.mjs --packaged packages/desktop/dist
      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find packages/desktop/dist -maxdepth 1 -type f ! -name 'builder-debug.yml' ! -name 'builder-effective-config.yaml' \
            -exec cp {} release-assets/ \;
          if [ -z "$(ls -A release-assets)" ]; then echo "No release assets were produced." >&2; exit 1; fi
          ls -l release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: [resolve, build]
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify required assets
        run: |
          set -euo pipefail
          ls -l release-assets
          for REQUIRED in \
            drone-mac-arm64.dmg drone-mac-x64.dmg drone-mac-arm64.zip drone-mac-x64.zip \
            drone-windows-x64.exe drone-windows-x64.zip \
            latest.yml latest-mac.yml; do
            [ -f "release-assets/$REQUIRED" ] || { echo "Missing required release asset: $REQUIRED" >&2; exit 1; }
          done
      - name: Upload assets to draft release (sequential, with retry)
        timeout-minutes: 90
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GODEBUG: http2client=0
        run: |
          set -uo pipefail
          for ASSET in release-assets/*; do
            echo "Uploading $ASSET"
            ATTEMPT=1
            until gh release upload "$RELEASE_TAG" "$ASSET" -R "${{ github.repository }}" --clobber; do
              if [ "$ATTEMPT" -ge 5 ]; then
                echo "Failed to upload $ASSET after $ATTEMPT attempts." >&2
                exit 1
              fi
              SLEEP_SECONDS=$((ATTEMPT * 20))
              echo "Upload failed for $ASSET (attempt $ATTEMPT). Retrying in ${SLEEP_SECONDS}s..." >&2
              sleep "$SLEEP_SECONDS"
              ATTEMPT=$((ATTEMPT + 1))
            done
          done
      - name: Verify uploaded assets and publish draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          ASSETS="$(gh release view "$TAG" -R "${{ github.repository }}" --json assets --jq '.assets[].name')"
          for LOCAL in release-assets/*; do
            NAME="$(basename "$LOCAL")"
            grep -Fxq "$NAME" <<<"$ASSETS" || { echo "Asset not on release: $NAME" >&2; exit 1; }
          done
          gh release edit "$TAG" -R "${{ github.repository }}" --draft=false

  website:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages deploy hook
        env:
          HOOK: ${{ secrets.CF_PAGES_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then
            curl -fsS -X POST "$HOOK"
          else
            echo "CF_PAGES_DEPLOY_HOOK not set, skipping"
          fi
